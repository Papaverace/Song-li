button, input { font: inherit }
button { cursor: pointer; color: inherit }
button:disabled { cursor: not-allowed }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px }
#app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding-block: 10px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.top h1 { margin: 0; font-size: clamp(28px, 3.4vw, 44px); line-height: 1; font-style: italic; color: var(--brass) }
.top small { display: block; font-size: 15px; font-style: normal; color: var(--soft); margin-top: 4px }
.tools { display: flex; gap: 8px; flex-wrap: wrap }
.tool { background: rgba(23, 18, 15, .6); border: 1px solid var(--line); color: var(--cream); border-radius: 3px; padding: 5px 12px }
.tool:hover { border-color: var(--soft) }

.table { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 22px; align-items: center; min-height: 0 }
.lot { min-width: 0; display: grid; place-items: center; gap: 10px }
.parcel { position: relative; width: min(100%, 390px); aspect-ratio: 5 / 3.6; background: repeating-linear-gradient(101deg, rgba(0,0,0,.035) 0 3px, transparent 3px 9px), linear-gradient(150deg, #d7b27e, var(--kraft) 55%, var(--kraft-d)); border-radius: 4px; box-shadow: 0 22px 30px rgba(0,0,0,.55); transform: rotate(-2.2deg) }
.parcel::before, .parcel::after { content: ""; position: absolute; background: #efe4cf; box-shadow: 0 1px 2px rgba(0,0,0,.4) }
.parcel::before { left: 0; right: 0; top: 50%; height: 5px; margin-top: -2px }
.parcel::after { top: 0; bottom: 0; left: 62%; width: 5px }
.tag { position: absolute; left: 7%; top: 13%; z-index: 1; background: var(--cream); color: var(--text); padding: 8px 14px; transform: rotate(-3deg); box-shadow: 0 2px 6px rgba(0,0,0,.35); border: 1px dashed #8d7a60 }
.tag small { display: block; font-size: 14px; letter-spacing: .14em; text-transform: uppercase }
.tag b { font-size: clamp(32px, 4vw, 46px); line-height: 1 }
.seal { position: absolute; left: 62%; top: 50%; z-index: 2; width: 74px; height: 74px; margin: -37px 0 0 -35px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #d4483d, var(--wax) 62%, #7a140e); color: #f6d9cf; font-size: 34px; font-weight: 700; box-shadow: 0 3px 7px rgba(0,0,0,.45) }
.parcel.knock { animation: knock .22s ease-out }
.parcel.shake { animation: shake .3s linear infinite }
@keyframes knock { 40% { transform: rotate(-2.2deg) translateY(7px) } }
@keyframes shake { 25% { transform: rotate(-5deg) } 75% { transform: rotate(3deg) } }
.rumor { margin: 0; text-align: center; font-style: italic; color: var(--cream); font-size: clamp(18px, 1.8vw, 22px); max-width: 38ch; text-wrap: balance; min-height: 2.6em }
.rumor span { display: block; font-style: normal; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--soft) }

.board { min-width: 0; display: flex; flex-direction: column; gap: 10px; text-shadow: 0 1px 6px rgba(0, 0, 0, .85) }
.rumor, .top small { text-shadow: 0 1px 6px rgba(0, 0, 0, .85) }
.hammer, .minor { text-shadow: none }
.facts { width: 100%; border-collapse: collapse; font-size: clamp(19px, 2vw, 24px) }
.facts td { padding: 4px 0; border-bottom: 1px solid var(--line) }
.facts td:last-child { text-align: right; font-weight: 700 }
.price { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.price small { display: block; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--soft) }
.price .big { font-size: clamp(62px, 8.6vw, 112px); line-height: .95; font-weight: 700; color: var(--brass); font-variant-numeric: tabular-nums }
.price .big i { font-size: .36em; font-style: normal }
.leader { font-size: clamp(22px, 2.6vw, 32px); font-weight: 700; overflow-wrap: anywhere; min-width: 0 }
.status { min-height: 1.4em; font-size: clamp(20px, 2.2vw, 28px); font-style: italic; color: var(--cream) }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.hammer { background: var(--brass); color: var(--text); border: 0; border-radius: 4px; padding: 10px 26px; font-size: 24px; font-weight: 700; box-shadow: 0 4px 0 #8a6a1e }
.hammer:disabled { background: var(--bg-3); color: var(--soft); box-shadow: none }
.minor { background: rgba(23, 18, 15, .6); border: 1px solid var(--line); color: var(--cream); border-radius: 4px; padding: 8px 14px }
.minor:disabled { opacity: .55 }

.ov { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(10, 7, 5, .88); padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: auto }

.time { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums }
.tbar { height: 8px; background: var(--cream-2) }
.tbar i { display: block; height: 100%; background: var(--t); transform-origin: left }
.body { padding: 16px 22px 20px; display: flex; flex-direction: column; gap: 12px }
.q { margin: 0; font-size: clamp(23px, 3vw, 36px); font-weight: 700; line-height: 1.22 }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px }
.opt { display: flex; gap: 10px; text-align: left; background: #fff; color: var(--text); border: 2px solid #c8b896; border-radius: 4px; padding: 9px 12px; font-size: clamp(19px, 2.2vw, 26px); min-width: 0 }
.opt span { min-width: 0 } .opt b { flex: none }

.opt.pick { border-color: var(--kraft-d); background: #fff0c2 }

.opt.wrong { background: var(--bad); border-color: var(--bad); color: #fff }

.row { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap }
.go { background: var(--text); color: var(--cream); border: 0; border-radius: 4px; padding: 9px 22px; font-size: 21px; font-weight: 700 }

h3.sec { margin: 0; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #5f5244 }
.set label { display: flex; gap: 8px; align-items: center; font-size: 19px }
.set input[type=text] { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid #a2906e; border-radius: 3px; background: #fff; color: var(--text) }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 19px }
.chip { background: #fff; color: var(--text); border: 1px solid #a2906e; border-radius: 3px; padding: 3px 13px }
.chip[aria-pressed=true] { background: var(--text); color: var(--cream) }
details summary { cursor: pointer; font-size: 19px }
.bank { max-height: 300px; overflow: auto; font-size: 17px; margin-top: 8px }
.bank h4 { margin: 10px 0 3px; font-size: 18px } .bank p { margin: 0 0 6px }
.bank i { color: var(--ok); font-style: normal; font-weight: 700 }
@media (max-width: 860px) {
  .table { grid-template-columns: minmax(0, 1fr) }
  .opts, .recap { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: reduce) { .parcel.knock, .parcel.shake { animation: none } }

<script>

  { name: "Sóng ngang", who: "Gia Huy",
    easy: [
      ["Trong sóng ngang, các phần tử môi trường dao động theo phương nào so với phương truyền sóng?", ["Vuông góc với phương truyền sóng", "Trùng với phương truyền sóng", "Hợp với phương truyền sóng một góc 45°", "Không xác định được"], "Định nghĩa sóng ngang: phương dao động vuông góc với phương truyền sóng."],
      ["Ví dụ nào sau đây là sóng ngang?", ["Sóng trên dây đàn guitar", "Sóng âm truyền trong không khí", "Sóng nén – dãn trên lò xo", "Sóng âm phát ra từ loa"], "Dây đàn dao động vuông góc với dây; các lựa chọn còn lại là sóng dọc."],
    ],
    med: [
      ["Căn cứ nào dùng để phân biệt sóng ngang và sóng dọc?", ["Phương dao động của phần tử so với phương truyền sóng", "Tốc độ truyền sóng", "Biên độ sóng", "Tần số của nguồn sóng"], "Hai loại sóng được phân biệt bằng phương dao động so với phương truyền."],
      ["Một sóng truyền từ trái sang phải trên sợi dây căng ngang. Một điểm trên dây chuyển động như thế nào?", ["Dao động lên – xuống quanh vị trí cân bằng", "Chạy từ trái sang phải cùng với sóng", "Chạy từ phải sang trái, ngược chiều sóng", "Đứng yên hoàn toàn"], "Phần tử dây dao động vuông góc với dây, còn trạng thái dao động lan đi."],
      ["Khi sóng ngang truyền trên mặt nước, điều gì lan ra xa nguồn?", ["Đỉnh sóng (trạng thái dao động)", "Các giọt nước gần nguồn", "Toàn bộ khối nước trên mặt", "Không có gì lan ra"], "Giọt nước chỉ nhấp nhô tại chỗ; đỉnh sóng mới lan ra xa."],

      ["Khán giả tạo \"làn sóng\" trên khán đài: mỗi người chỉ đứng lên rồi ngồi xuống tại chỗ, còn làn sóng chạy quanh sân. Hiện tượng này giống mô hình nào?", ["Sóng ngang, vì người dao động lên – xuống còn làn sóng lan theo phương ngang", "Sóng dọc, vì mọi người cùng đứng lên theo một hướng", "Sóng ngang, vì mỗi người di chuyển theo làn sóng", "Không giống sóng, vì không ai rời chỗ"], "Mỗi người giống một phần tử: dao động tại chỗ, vuông góc với hướng lan của làn sóng."],

      ["Trên mặt hồ, khoảng cách giữa 5 đỉnh sóng liên tiếp là 8 m. Một chiếc lá nhấp nhô với tần số 0,5 Hz. Tốc độ truyền sóng là bao nhiêu?", ["1,0 m/s", "0,8 m/s", "2,0 m/s", "4,0 m/s"], "5 đỉnh tạo 4 bước sóng: λ = 8/4 = 2 m. Suy ra v = λf = 2 × 0,5 = 1,0 m/s."],
      ["Một nguồn sóng tăng tần số gấp đôi. Coi môi trường không đổi và tốc độ truyền sóng không phụ thuộc tần số. Điều gì xảy ra?", ["Bước sóng giảm một nửa, tốc độ truyền sóng không đổi", "Tốc độ truyền sóng tăng gấp đôi, bước sóng không đổi", "Bước sóng tăng gấp đôi, tốc độ truyền sóng không đổi", "Tốc độ truyền sóng và bước sóng đều giảm một nửa"], "v = λf và v không đổi nên f tăng gấp đôi thì λ giảm một nửa."],

      ["Năng lượng âm đi từ loa đến tai bạn bằng cách nào?", ["Qua các lớp không khí nén – dãn liên tiếp truyền dao động cho nhau", "Nhờ các phân tử khí bay trực tiếp từ loa đến tai", "Nhờ gió thổi liên tục từ loa ra", "Nhờ ánh sáng phát ra từ loa"], "Năng lượng được chuyền qua các lớp khí nén – dãn liên tiếp."],

    hard: [

      ["Loa bass bật to làm kính cửa sổ gần đó rung lên. Hiện tượng này chứng tỏ điều gì?", ["Sóng âm mang năng lượng từ loa đến làm kính dao động", "Phân tử khí từ màng loa đã bay đến đập vào kính", "Kính tự sinh ra năng lượng dao động", "Sóng âm truyền ánh sáng đến kính"], "Kính nhận năng lượng từ sóng âm nên dao động theo, dù khí không bay từ loa đến kính."],

  secret: { name: "Câu hỏi bí mật",    short: "Câu hỏi với phần thưởng bí mật", hex: "#b06ad4", mark: "?", time: 30, rumor: "Không ai nhớ ai đã gửi gói này." },

const SECRET_REWARDS = [5, 15, 30, 50, 80];
const COMP = {

const TRAPS = [

const DEFAULT_NAMES = ["Đội Sóng Ngang", "Đội Sóng Dọc", "Đội Lò Xo", "Đội Màng Nhĩ", "Đội Bass", "Đội Phao Câu"];

/* ============ TRẠNG THÁI ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, calm ? ms * .25 : ms));
const isQ = k => ["easy", "med", "hard", "secret"].includes(k);

function makeLots(n) {
  const order = shuffle([0, 1, 2, 3]); let qi = 0;
  return shuffle(COMP[n]).map(kind => {
    const rumorKind = Math.random() < .6 ? kind : pick(Object.keys(KINDS));
    return { kind, part: isQ(kind) ? order[qi++ % 4] : Math.floor(Math.random() * 4), rumor: KINDS[rumorKind].rumor };
  });
}
function freshGame(names, n) {
  return { teams: names.map(name => ({ name, xu: START_XU, steal: false })), lots: makeLots(n), idx: 0, count: n };
}
let S = freshGame(DEFAULT_NAMES.slice(0, 4), 6);
let A = { price: START_PRICE, leader: null, hist: [] };
let phase = "auction", primary = null, sound = true, status = "", hammerRun = 0, hammering = false;
const pools = {};
function save() { try { localStorage.setItem("cho-den", JSON.stringify(S)); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem("cho-den"));
    if (d && d.teams && d.lots && d.idx < d.lots.length) S = d;
  } catch (e) {}
}
function draw(part, diff) {
  const key = part + diff;
  if (!pools[key] || !pools[key].length) pools[key] = shuffle(PARTS[part][diff]);
  return pools[key].pop();
}
const lot = () => S.lots[S.idx];
const target = (i, step) => A.leader === null ? START_PRICE + STEPS.indexOf(step) * 10 : A.price + step;
const canAll = t => A.leader === null ? t.xu >= START_PRICE : t.xu > A.price;

/* ============ HIỂN THỊ ============ */
function render() {
  const open = phase === "auction";
  const l = lot() || S.lots[S.lots.length - 1];
  $("lotNo").textContent = "#" + String(Math.min(S.idx + 1, S.lots.length)).padStart(2, "0");
  $("stall").textContent = `Phần ${l.part + 1}: ${PARTS[l.part].name}`;
  $("rumor").innerHTML = `<span>Tin đồn, không đảm bảo</span>${esc(l.rumor)}`;
  $("price").textContent = A.price;
  $("leader").textContent = A.leader === null ? "Chưa có người trả giá" : S.teams[A.leader].name;
  $("status").textContent = status;
  $("btnHammer").disabled = !open || A.leader === null || hammering;
  $("btnUndo").disabled = !open || !A.hist.length;
  $("btnPass").disabled = !open || A.leader !== null;
  $("teams").innerHTML = S.teams.map((t, i) => {
    const bids = STEPS.map(s => {
      const v = target(i, s), off = !open || A.leader === i || t.xu < v;
      return `<button class="bid" type="button" data-b="${i}:${s}" ${off ? "disabled" : ""}>${A.leader === null ? v : "+" + s}</button>`;
    }).join("");
    return `<div class="team ${A.leader === i ? "lead" : ""}">
      <div class="thead"><button class="nm" type="button" data-rename title="Đổi tên đội">${esc(t.name)}</button><span class="xu">${t.xu} <small>xu</small></span></div>
      ${t.steal ? "<span class='card'>Thẻ Cướp một lượt</span>" : ""}
      <div class="bids">${bids}<button class="bid" type="button" data-all="${i}" ${!open || A.leader === i || !canAll(t) ? "disabled" : ""}>Tất tay</button></div>
    </div>`;
  }).join("");
}
function overlay(html) { const o = $("ov"); o.innerHTML = html; o.hidden = false; }
function closeOverlay() { $("ov").hidden = true; $("ov").innerHTML = ""; }
function goBtn(label, fn, id = "go") { primary = fn; const b = $(id); b.textContent = label; b.onclick = () => primary && primary(); b.focus({ preventScroll: true }); }

/* ============ ĐẤU GIÁ ============ */
function setBid(i, v) {
  if (phase !== "auction") return;
  const t = S.teams[i];
  if (A.leader === i || v > t.xu || (A.leader !== null && v <= A.price) || v < START_PRICE) return;
  audio();
  A.hist.push({ price: A.price, leader: A.leader });
  A.price = v; A.leader = i;
  if (hammering) { hammerRun++; hammering = false; status = "Có giá mới, dừng búa!"; }
  else status = pick(["Có người trả giá.", "Còn ai trả cao hơn không?", "Giá đang nóng lên.", "Cả chợ đang nhìn."]);
  tone(620, .08, "triangle", .13); tone(930, .1, "triangle", .1, .07);
  render();
}
function bid(i, step) { setBid(i, target(i, step)); }
function undo() {
  if (phase !== "auction" || !A.hist.length) return;
  hammerRun++; hammering = false;
  const h = A.hist.pop(); A.price = h.price; A.leader = h.leader; status = "Đã hoàn tác lần trả giá vừa rồi."; render();
}
async function hammer() {
  if (phase !== "auction" || A.leader === null || hammering) return;
  audio();
  hammering = true; const run = ++hammerRun;
  const cry = S.teams[A.leader].name;
  for (const c of [`${A.price} xu lần thứ nhất...`, `${A.price} xu lần thứ hai...`, `${A.price} xu lần thứ ba...`]) {
    status = c; render(); knock();
    await wait(1000);
    if (run !== hammerRun) return;
  }
  hammering = false;
  status = `Chốt! ${cry} mua với giá ${A.price} xu.`;
  knock(); tone(140, .3, "square", .12);
  sold();
}
function sold() {
  phase = "sold"; primary = null;
  const w = S.teams[A.leader];
  w.xu -= A.price; save(); render();
  const thieves = S.teams.map((t, i) => ({ t, i })).filter(x => x.t.steal && x.i !== A.leader);
  if (!thieves.length) return openLot(A.leader, A.price);
  overlay(`<div class="panel" style="--t:var(--kraft-d)">
    <div class="ph"><b>Thẻ Cướp một lượt</b><span>Gói #${String(S.idx + 1).padStart(2, "0")}</span></div>
    <div class="body"><p class="q">${esc(w.name)} vừa mua gói này với giá ${A.price} xu. Có đội nào muốn cướp không?</p>
    <p style="margin:0;font-size:20px">Đội cướp nhận gói miễn phí, kể cả khi đó là bẫy. ${esc(w.name)} được hoàn lại tiền.</p>
    <div class="row">${thieves.map(x => `<button class="go" type="button" data-th="${x.i}">${esc(x.t.name)} cướp</button>`).join("")}<button class="go ghost" type="button" id="noSteal">Không cướp</button></div></div></div>`);
  document.querySelectorAll("[data-th]").forEach(b => b.onclick = () => {
    const i = +b.dataset.th;
    S.teams[i].steal = false; w.xu += A.price; save(); render();
    openLot(i, 0);
  });
  $("noSteal").onclick = () => openLot(A.leader, A.price);
  primary = () => openLot(A.leader, A.price);
}
function parcelHtml() {
  return `<div class="parcel shake" id="pc"><div class="tag"><small>Gói bí ẩn</small><b>#${String(S.idx + 1).padStart(2, "0")}</b></div><div class="seal">?</div></div>`;
}
async function openLot(owner, paid) {
  phase = "reveal"; primary = null;
  const l = lot(), k = KINDS[l.kind], team = S.teams[owner];
  overlay(`<div class="reveal">${parcelHtml()}<h2 id="rvT">...</h2><p id="rvP">${esc(team.name)} đang mở gói</p><div class="row" id="rvB"></div></div>`);
  for (let i = 0; i < 4; i++) { tone(200 + i * 70, .12, "triangle", .12); await wait(420); }
  const pc = $("pc"); pc.classList.remove("shake"); pc.classList.add("open");
  $("rvT").textContent = k.name; $("rvT").style.color = l.kind === "trap" ? "#ff8a7a" : k.hex; 
  $("rvB").innerHTML = `<button class="go" type="button" id="go"></button>`;
  if (l.kind === "trap") {
    const lost = Math.min(20, team.xu); team.xu -= lost; save(); render();
    fanfare("trap");
    $("rvP").textContent = `${pick(TRAPS)} ${team.name} mất thêm ${lost} xu.`;
    return goBtn("Gói tiếp theo", nextLot);
  }
  if (l.kind === "power") {
    team.steal = true; save(); render();
    fanfare("win");
    $("rvP").textContent = `${team.name} nhận thẻ Cướp một lượt: dùng để cướp một gói mà đội khác vừa mua.`;
    return goBtn("Gói tiếp theo", nextLot);
  }
  fanfare("open");
  $("rvP").textContent = l.kind === "secret" ? "Phần thưởng chỉ được công bố sau khi trả lời." : `Trả lời đúng được ${k.reward} xu.`;
  goBtn("Mở câu hỏi", () => question(owner, paid));
}

/* ============ CÂU HỎI ============ */
let Q = null, timer = null;
function question(owner, paid) {
  const l = lot(), k = KINDS[l.kind], team = S.teams[owner];
  const diff = l.kind === "secret" ? pick(["med", "hard"]) : l.kind;
  const [text, opts, why] = draw(l.part, diff);
  const order = shuffle(opts.map((o, i) => ({ o, ok: i === 0 })));
  Q = { owner, paid, why, order, left: k.time, total: k.time, done: false, paused: false, reward: l.kind === "secret" ? pick(SECRET_REWARDS) : k.reward };
  phase = "question"; primary = null;
  overlay(`<div class="panel" style="--t:${k.hex}">
    <div class="ph"><b>${k.name} · ${l.kind === "secret" ? "??? xu" : k.reward + " xu"}</b><span>${esc(team.name)} · Phần ${l.part + 1}: ${PARTS[l.part].name}</span><span class="time" id="sec">${k.time}</span></div>
    <div class="tbar"><i id="bar"></i></div>
    <div class="body"><p class="q">${esc(text)}</p>
      <div class="opts">${order.map((x, i) => `<button class="opt" type="button" data-i="${i}"><b>${"ABCD"[i]}.</b><span>${esc(x.o)}</span></button>`).join("")}</div>
      <div class="after" id="after" hidden></div>
      <div class="row" id="foot"><button class="go ghost" type="button" id="pause">Tạm dừng</button></div>
    </div></div>`);
  $("pause").onclick = () => { Q.paused = !Q.paused; $("pause").textContent = Q.paused ? "Chạy tiếp" : "Tạm dừng"; };
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  clearInterval(timer);
  let last = performance.now();
  timer = setInterval(() => {
    const now = performance.now(), dt = (now - last) / 1000; last = now;
    if (Q.paused || Q.done) return;
    const before = Math.ceil(Q.left);
    Q.left = Math.max(0, Q.left - dt);
    const s = Math.ceil(Q.left);
    $("sec").textContent = s; $("bar").style.transform = `scaleX(${Q.left / Q.total})`;
    if (s !== before && s <= 5 && s > 0) tone(880, .07, "square", .07);
    if (Q.left <= 0) answer(-1);
  }, 100);
}
async function answer(i) {
  if (!Q || Q.done) return;
  Q.done = true; clearInterval(timer);
  const team = S.teams[Q.owner], btns = [...document.querySelectorAll(".opt")];
  btns.forEach(b => b.disabled = true); $("pause").hidden = true;
  if (i >= 0) { btns[i].classList.add("pick"); for (let n = 0; n < 5; n++) { tone(130, .05, "square", .06); await wait(170); } }
  const ok = i >= 0 && Q.order[i].ok;
  btns.forEach((b, n) => { b.classList.remove("pick"); b.classList.add(Q.order[n].ok ? "right" : n === i ? "wrong" : "dim"); });
  const secret = lot().kind === "secret";
  const gain = ok ? Q.reward : 0; team.xu += gain; save(); render();
  fanfare(ok ? "right" : "wrong");
  const net = gain - Q.paid;
  const deal = Q.paid ? ` Bỏ ra ${Q.paid} xu, thu về ${gain} xu: ${net > 0 ? "lãi " + net : net < 0 ? "lỗ " + (-net) : "hoà vốn"}.` : "";
  const head = ok ? `+${gain} xu cho ${team.name}.` : secret ? `Phần thưởng vừa đánh rơi: ${Q.reward} xu.` : i < 0 ? "Hết giờ, đội không nhận được xu." : "Đội không nhận được xu.";
  const after = $("after"); after.hidden = false;
  after.innerHTML = `<h3 class="${ok ? "yes" : "no"}">${ok ? "Chính xác!" : i < 0 ? "Hết giờ!" : "Chưa đúng!"}</h3>
    <p><b>${esc(head + deal)}</b></p><p>${esc(Q.why)}</p><p class="mc">${esc(pick(ok ? RIGHT : WRONG))}</p>`;
  phase = "result";
  $("foot").innerHTML = `<button class="go" type="button" id="go"></button>`;
  goBtn("Gói tiếp theo", nextLot);
  $("go").scrollIntoView({ block: "nearest" });
}

/* ============ CHUYỂN GÓI ============ */
async function pass() {
  if (phase !== "auction" || A.leader !== null) return;
  audio();
  phase = "reveal"; primary = null;
  const l = lot(), k = KINDS[l.kind];
  overlay(`<div class="reveal">${parcelHtml()}<h2 id="rvT">...</h2><p id="rvP">Không ai mua. Cả chợ xem bên trong có gì.</p><div class="row" id="rvB"></div></div>`);
  await wait(900);
  $("pc").classList.remove("shake"); $("pc").classList.add("open");
  $("rvT").textContent = k.name; $("rvT").style.color = l.kind === "trap" ? "#ff8a7a" : k.hex; 
  $("rvP").textContent = l.kind === "trap" ? "Cả chợ vừa thoát một cú lừa." : `Gói bị bỏ lại: ${k.short}.`;
  $("rvB").innerHTML = `<button class="go" type="button" id="go"></button>`;
  goBtn("Gói tiếp theo", nextLot);
}
function nextLot() {
  S.idx++;
  A = { price: START_PRICE, leader: null, hist: [] };
  status = ""; hammering = false; hammerRun++;
  closeOverlay();
  if (S.idx >= S.lots.length || S.teams.every(t => t.xu < START_PRICE)) return finale();
  phase = "auction"; primary = null; save(); render();
  $("parcel").classList.remove("knock");
}
function finale() {
  phase = "end"; primary = null; S.idx = S.lots.length; save(); render();
  const list = S.teams.slice().sort((a, b) => b.xu - a.xu);
  const titles = ["Trùm chợ đen", "Tay buôn lão luyện", "Khách quen của chợ", "Người mua học phí", "Khách vãng lai", "Vừa lạc vào chợ"];
  fanfare("win");
  overlay(`<div class="panel" style="--t:var(--wax)">
    <div class="ph"><b>Đóng cửa chợ: kết quả và tổng kết</b></div>
    <div class="body"><ol class="rank">${list.map((t, i) => `<li><span>${i + 1}</span><span>${esc(t.name)}<em>${titles[Math.min(i, titles.length - 1)]}</em></span><span class="sc">${t.xu} xu</span></li>`).join("")}</ol>
      <h3 class="sec">Bốn điều mang về từ Bài 9</h3>
      <ul class="recap">${RECAP.map(r => `<li><b>${r[0]}</b>${r[1]}</li>`).join("")}</ul>
      <div class="row"><button class="go" type="button" id="go"></button></div></div></div>`);
  goBtn("Mở phiên mới", restart);
}
function restart() {
  S = freshGame(S.teams.map(t => t.name), S.count);
  A = { price: START_PRICE, leader: null, hist: [] }; status = "";
  closeOverlay(); phase = "auction"; primary = null; save(); render();
}

/* ============ TÊN ĐỘI VÀ THIẾT LẬP ============ */
function openRename() {
  if (phase !== "auction" || hammering) return;
  phase = "setup";
  overlay(`<div class="panel" style="--t:var(--bg-3)">
    <div class="ph"><b>Đổi tên đội</b><span>Số xu được giữ nguyên</span></div>
    <div class="body set"><div style="display:flex;flex-direction:column;gap:6px">${S.teams.map((t, i) => `<label for="rn${i}">Đội ${i + 1}<input type="text" id="rn${i}" maxlength="28" value="${esc(t.name)}"></label>`).join("")}</div>
    <div class="row"><button class="go ghost" type="button" id="rnCancel">Đóng</button><button class="go" type="button" id="rnSave">Lưu tên</button></div></div></div>`);
  const close = () => { closeOverlay(); phase = "auction"; render(); };
  const commit = () => { S.teams.forEach((t, i) => { t.name = $("rn" + i).value.trim() || t.name; }); save(); close(); };
  $("rnCancel").onclick = close; $("rnSave").onclick = commit;
  $("ov").querySelectorAll("input").forEach(b => b.onkeydown = e => { if (e.key === "Enter") commit(); });
  $("rn0").select();
}
function openSetup() {
  if (phase !== "auction" || hammering) return;
  phase = "setup";
  let count = S.teams.length, lots = S.count;
  const names = S.teams.map(t => t.name).concat(DEFAULT_NAMES.slice(S.teams.length));
  overlay(`<div class="panel" style="--t:var(--bg-3)">
    <div class="ph"><b>Thiết lập</b></div>
    <div class="body set"><div class="chips" id="cnt"></div><div class="chips" id="lts"></div>
      <div id="nms" style="display:flex;flex-direction:column;gap:6px"></div>
      <details><summary>Xem ngân hàng câu hỏi và đáp án</summary><div class="bank">${PARTS.map((p, i) => `<h4>Phần ${i + 1}: ${p.name} (${p.who})</h4>` + ["easy", "med", "hard"].map(d => p[d].map(q => `<p>[${KINDS[d].name}] ${esc(q[0])} <i>${esc(q[1][0])}</i></p>`).join("")).join("")).join("")}</div></details>
      <div class="row"><button class="go ghost" type="button" id="end">Đóng chợ ngay</button><button class="go ghost" type="button" id="cancel">Đóng</button><button class="go" type="button" id="apply">Áp dụng và mở phiên mới</button></div>
    </div></div>`);
  const keep = () => { for (let i = 0; i < count; i++) names[i] = $("nm" + i).value.trim() || DEFAULT_NAMES[i]; };
  const chips = () => {
    $("cnt").innerHTML = "Số đội: " + [2, 3, 4, 5, 6].map(n => `<button class="chip" type="button" aria-pressed="${n === count}" data-c="${n}">${n}</button>`).join("");
    $("lts").innerHTML = "Số gói: " + [6, 8, 10].map(n => `<button class="chip" type="button" aria-pressed="${n === lots}" data-l="${n}">${n}</button>`).join("");
    $("nms").innerHTML = names.slice(0, count).map((n, i) => `<label for="nm${i}">Đội ${i + 1}<input type="text" id="nm${i}" maxlength="28" value="${esc(n)}"></label>`).join("");
    document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { keep(); count = +b.dataset.c; chips(); });
    document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { keep(); lots = +b.dataset.l; chips(); });
  };
  chips();
  $("cancel").onclick = () => { closeOverlay(); phase = "auction"; render(); };
  $("end").onclick = () => { closeOverlay(); finale(); };
  $("apply").onclick = () => { keep(); S = freshGame(names.slice(0, count), lots); A = { price: START_PRICE, leader: null, hist: [] }; status = ""; closeOverlay(); phase = "auction"; save(); render(); };
}

/* ============ ÂM THANH ============ */
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); }
function tone(f, d, type = "sine", vol = .1, at = 0) {
  if (!sound || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}
function knock() {
  tone(170, .1, "square", .18); tone(90, .16, "sine", .25);
  const p = $("parcel"); p.classList.remove("knock"); void p.offsetWidth; p.classList.add("knock");
}
function fanfare(k) {
  const seq = { open: [392, 494, 587], win: [523, 659, 784, 1047, 1319], right: [659, 988], wrong: [233, 175], trap: [311, 293, 277, 233] }[k] || [];
  seq.forEach((f, i) => tone(f, k === "trap" ? .32 : .22, k === "trap" || k === "wrong" ? "sawtooth" : "triangle", .13, i * (k === "trap" ? .24 : .12)));
}

/* ============ NÚT VÀ PHÍM ============ */
$("btnHammer").onclick = hammer; $("btnUndo").onclick = undo; $("btnPass").onclick = pass;
$("btnSet").onclick = openSetup; $("btnRename").onclick = openRename;
$("btnSound").onclick = () => { sound = !sound; $("btnSound").textContent = "Âm thanh: " + (sound ? "bật" : "tắt"); audio(); };
$("btnFull").onclick = () => { const d = document; if (d.fullscreenElement) d.exitFullscreen(); else { const p = d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); if (p) p.catch(() => {}); } };
$("teams").addEventListener("click", e => {
  if (e.target.closest("[data-rename]")) return openRename();
  const b = e.target.closest("[data-b]"), all = e.target.closest("[data-all]");
  if (b) { const [i, s] = b.dataset.b.split(":").map(Number); bid(i, s); }
  if (all) { const i = +all.dataset.all; setBid(i, S.teams[i].xu); }
});
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.repeat) return;
  if (phase === "question" && !Q.done) {
    const i = "abcd".indexOf(e.key.toLowerCase()), n = "1234".indexOf(e.key);
    if (i >= 0 || n >= 0) { e.preventDefault(); answer(i >= 0 ? i : n); }
    return;
  }
  if (phase === "auction" && /^[1-6]$/.test(e.key) && S.teams[+e.key - 1]) { e.preventDefault(); bid(+e.key - 1, 5); return; }
  if ([" ", "Enter", "PageDown", "ArrowRight"].includes(e.key)) {
    if (phase === "auction") { e.preventDefault(); hammer(); }
    else if (primary) { e.preventDefault(); primary(); }
  }
});

load();
render();
</script>
